name: release-patched

# 推 v 开头的 tag (例如 v1.3.1-patched) 时触发, 编 Linux amd64 二进制并发布到 Releases.
# 不依赖官方 release.yml 的 goreleaser / Maven / GPG secrets, 只用 GITHUB_TOKEN.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # 也允许在 Actions UI 手动触发(不发 release, 只产 artifact)

permissions:
  contents: write           # 创建 release / 上传二进制需要

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # zig cc 作为 CGO 的 cross-compiler, 显式 target glibc 2.17 (CentOS 7 / RHEL 7).
      # 默认 ubuntu-22.04 的 gcc 链 glibc 2.35, 老 base image (glibc < 2.25) 上跑会缺符号.
      - name: Install zig
        run: |
          ZIG_VERSION=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
              -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          rm /tmp/zig.tar.xz
          echo "$HOME/.zig" >> $GITHUB_PATH
          "$HOME/.zig/zig" version

      - name: File notification regression
        run: go test -race ./pkg/vfs ./pkg/meta ./cmd -run 'TestDirectoryParent|TestDirectoryPosition|TestChange|TestCommitted|TestInvalidation' -count=1

      - name: Build (CGO + glibc 2.17 target)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          CC: zig cc -target x86_64-linux-gnu.2.17
          CXX: zig c++ -target x86_64-linux-gnu.2.17
        run: |
          REV=$(git rev-parse --short HEAD)
          REV_DATE=$(git log -1 --format=%cs)
          TAG=${GITHUB_REF_NAME:-manual}
          go build \
              -ldflags="-s -w -X github.com/juicedata/juicefs/pkg/version.revision=${REV}-${TAG} -X github.com/juicedata/juicefs/pkg/version.revisionDate=${REV_DATE}" \
              -o juicefs-linux-amd64 \
              .
          ls -lh juicefs-linux-amd64

      - name: Verify glibc requirement
        run: |
          echo "=== Required GLIBC symbol versions ==="
          objdump -T juicefs-linux-amd64 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -uV || \
              strings juicefs-linux-amd64 | grep -oE 'GLIBC_[0-9.]+' | sort -uV
          echo "=== Highest required GLIBC ==="
          MAX_GLIBC=$(strings juicefs-linux-amd64 | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
          echo "$MAX_GLIBC"
          # 期望: 不应该超过 GLIBC_2.17
          if [ "$(printf '%s\n' GLIBC_2.17 "$MAX_GLIBC" | sort -V | tail -1)" != "GLIBC_2.17" ]; then
              echo "✗ WARNING: binary requires glibc newer than 2.17, may not work on old systems"
              exit 1
          fi
          echo "✓ binary compatible with glibc 2.17+"

      - name: Smoke test
        run: |
          file juicefs-linux-amd64
          VERSION=$(./juicefs-linux-amd64 version)
          echo "$VERSION"
          case "$VERSION" in
            *"${GITHUB_REF_NAME}"*) ;;
            *) echo "binary version is missing the patch tag"; exit 1 ;;
          esac
          if strings juicefs-linux-amd64 | grep -q "ignoring DDL permission"; then
              echo "✓ PATCH MARKER FOUND in binary"
          else
              echo "✗ WARNING: patch marker not found, binary may not be patched"
          fi

      - name: Linux multi-mount cache test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fuse3
          sudo python3 tests/file_change_notifications.py ./juicefs-linux-amd64
          sha256sum juicefs-linux-amd64 > juicefs.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: juicefs-linux-amd64
          path: |
            juicefs-linux-amd64
            juicefs.sha256
          retention-days: 30

  release:
    needs: build
    # 只有 tag 推送才发 release; workflow_dispatch 手动触发只产 artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: juicefs-linux-amd64
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/juicefs-linux-amd64
            dist/juicefs.sha256
          generate_release_notes: true
          body: |
            Patched build of JuiceFS with scoped cache invalidation and diagnostics.

            - 自动通知以挂载 patterns 为硬上限，订阅不能扩大范围。
            - 带 patterns 的失效只处理请求与规则的交集；显式主动 API 不受监听规则限制。
            - 定向失效不扫描全局索引；父链无法定位时明确失败，不回退到清卷。
            - 增加失效阶段、锁持有者、占用句柄、过滤计数与健康汇总日志及 Prometheus 指标。
            - 保留 OceanBase DDL 权限兼容、OSS V1 签名及 glibc 2.17 兼容构建。

            二进制在发布前通过通知并发回归和 Linux 双挂载缓存测试。
            `juicefs.sha256` 校验二进制完整性；目标 JuiceFS 环境仍需验证跨节点可见性及日志采集。

            ## Install

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/juicefs-linux-amd64 \
                -o /tmp/juicefs && chmod +x /tmp/juicefs
            sudo mv /tmp/juicefs /usr/local/bin/juicefs
            juicefs version
            ```
